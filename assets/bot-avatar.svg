<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Avatar do bot. Fundo azul cheio, marca em papel: o Telegram mostra o
       avatar como circulo pequeno numa lista, e traço azul sobre papel some
       nesse tamanho. Invertido, a marca continua legivel a 40px.
       A marca ocupa 52% da largura para sobrar margem ao corte circular. -->
  <rect width="512" height="512" fill="#2c527a"/>
  <g transform="translate(133,133) scale(8.3)">
    <circle cx="16" cy="16" r="12.6" fill="none" stroke="#f5f3ee" stroke-width="1.9"/>
    <circle cx="16" cy="16" r="6.2"  fill="none" stroke="#f5f3ee" stroke-width="1.2" opacity=".45"/>
    <path d="M16 16 L24.7 7.6" stroke="#f5f3ee" stroke-width="1.9" stroke-linecap="round" fill="none"/>
    <circle cx="22.1" cy="21.6" r="2.4" fill="#f5f3ee"/>
  </g>
</svg>
